# configs/pipeline_config.yaml
# Step1 数据 Pipeline 配置

data:
  matrix: small_matrix          # small_matrix 或 big_matrix
  watch_ratio_threshold: 0.5    # 正样本阈值
  watch_ratio_clip: 5.0         # watch_ratio 截断上限
  min_user_interactions: 10     # 冷启动过滤
  min_item_interactions: 5

sampling:
  neg_ratio: 4                  # 正:负 = 1:4
  random_neg_ratio: 0.5         # 负样本中随机采样比例
  hot_pool_size: 2000
  test_ratio: 0.2
  random_seed: 42

features:
  seq_len: 50                   # 行为序列最大长度
  max_cat_cols: 20              # 视频类别最多保留列数
