# configs/feature_config.yaml
# 特征列定义

user_features:
  id_col: user_id
  stat_cols:                    # 行为统计特征
    - interaction_count
    - avg_watch_ratio
    - std_watch_ratio
    - positive_rate
    - max_watch_ratio
    - activity_tier

item_features:
  id_col: item_id
  stat_cols:                    # 视频统计特征
    - play_count
    - avg_watch_ratio
    - ctr_proxy
    - std_watch_ratio
    - popularity_tier

sequence:
  seq_col: pos_seq              # 使用正反馈序列
  seq_len: 50
