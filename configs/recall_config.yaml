# configs/recall_config.yaml
# Step2 双塔召回模型配置

model:
  embedding_dim: 64
  hidden_layers: [256, 128, 64]
  dropout: 0.2
  temperature: 0.07             # InfoNCE temperature

training:
  lr: 0.001
  batch_size: 2048
  epochs: 20
  early_stop: 3
  random_seed: 42

serving:
  recall_k: 200                 # 召回候选数
  faiss_index_type: flat        # flat（精确）或 ivf（近似，大规模用）
