# configs/ranking_config.yaml
# Step3 DIN 精排模型配置

model:
  embedding_dim: 32
  attention_hidden: [64, 16]
  dnn_hidden: [256, 128, 64]
  dropout: 0.3
  tower_emb_dim: 64             # Step2 Embedding 维度
  watch_ratio_max: 3.0

training:
  lr: 0.0005
  batch_size: 2048
  epochs: 30
  early_stop: 4
  multitask_alpha: 0.5          # α*CTR + (1-α)*完播率
  random_seed: 42

serving:
  top_n: 10                     # 最终返回推荐数
  alpha: 0.5                    # 融合排序权重
